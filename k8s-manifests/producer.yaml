apiVersion: batch/v1
kind: Job
metadata:
  name: covid-producer-job
  labels:
    app: covid-producer
    mode: batch
    component: data-pipeline
spec:
  # Job will retry once if it fails
  backoffLimit: 1
  # Clean up completed jobs after 1 hour
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: covid-producer
        mode: batch
    spec:
      containers:
        - name: producer
          image: python:3.9-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              
              echo "Installing dependencies..."
              pip install --no-cache-dir kafka-python
              
              echo "Waiting for data file at /app/data/covid_0.csv..."
              WAIT_COUNT=0
              while [ ! -f /app/data/covid_0.csv ]; do
                sleep 2
                WAIT_COUNT=$((WAIT_COUNT + 1))
                if [ $WAIT_COUNT -gt 60 ]; then
                  echo "ERROR: Data file not found after 120s"
                  exit 1
                fi
              done
              
              echo "Data file found! Starting batch processing..."
              python -u /app/code/kafka_producer.py
          env:
            # Kafka Configuration
            - name: BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: TOPIC_NAME
              value: "covid-raw"
            
            # File Configuration
            - name: DATA_FILE
              value: "/app/data/covid_0.csv"
            - name: FILE_WAIT_TIMEOUT
              value: "120"
            
            # Processing Configuration
            - name: BATCH_LOG_INTERVAL
              value: "2000"
            
            # Retry Configuration
            - name: MAX_RETRIES
              value: "3"
            - name: RETRY_DELAY
              value: "5"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: code-volume
              mountPath: /app/code
              readOnly: true
            - name: data-volume
              mountPath: /app/data
      volumes:
        - name: code-volume
          configMap:
            name: producer-script
        - name: data-volume
          emptyDir:
            sizeLimit: 500Mi
      restartPolicy: OnFailure