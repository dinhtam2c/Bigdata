apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  labels:
    app: consumer
    component: data-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
        component: data-pipeline
    spec:
      containers:
        - name: consumer
          image: python:3.9-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "Installing dependencies..."
              pip install --no-cache-dir kafka-python hdfs
              
              echo "Starting consumer..."
              python -u /app/code/kafka_consumer.py
          env:
            # Kafka Configuration
            - name: BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: TOPIC_NAME
              value: "covid-raw"
            - name: GROUP_ID
              value: "hdfs-consumer-v1"
            
            # HDFS Configuration
            - name: HDFS_URL
              value: "http://hdfs-namenode-0.hdfs-namenode.default.svc.cluster.local:9870"
            - name: HDFS_USER
              value: "root"
            - name: HDFS_PATH
              value: "/covid/raw"
            
            # Processing Configuration
            - name: BATCH_SIZE
              value: "500"
            - name: BATCH_TIMEOUT
              value: "30"
            
            # Retry Configuration
            - name: MAX_RETRIES
              value: "3"
            - name: RETRY_DELAY
              value: "5"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: code-volume
              mountPath: /app/code
              readOnly: true
          # Health checks
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f kafka_consumer.py
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: code-volume
          configMap:
            name: consumer-script
      restartPolicy: Always
